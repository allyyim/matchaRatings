<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sip & Score</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Rate matcha tea and discover your perfect brew" />
    <meta name="theme-color" content="#198754" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sip & Score" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <style>
      html, body {
        -webkit-user-select: none;
        user-select: none;
        touch-action: pan-x pan-y;
        -ms-touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
    </style>
    <script>
      // iOS Safari ignores user-scalable=no in the viewport meta tag,
      // so block pinch/double-tap zoom gestures explicitly for the PWA.
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 350) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // GitHub Pages SPA routing redirect restoration
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script>
      // Redirect handler for 404.html
      if (window.location.pathname !== '/' && !window.location.pathname.includes('.')) {
        sessionStorage.redirect = window.location.href;
      }
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        // Get the base path from the current URL
        const basePath = window.location.pathname.replace(/index\.html$/, '').replace(/\/$/, '') || '/';
        const swPath = basePath + '/service-worker.js';
        navigator.serviceWorker.register(swPath).then(reg => {
          console.log('Service Worker registered:', swPath);
        }).catch(err => {
          console.log('Service Worker registration failed:', err);
        });
      }
    </script>
  </body>
</html>
