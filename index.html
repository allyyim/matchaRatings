<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sip & Score</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Rate matcha tea and discover your perfect brew" />
    <meta name="theme-color" content="#198754" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sip & Score" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <style>
      body {
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // GitHub Pages SPA routing redirect restoration
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script>
      // Redirect handler for 404.html
      if (window.location.pathname !== '/' && !window.location.pathname.includes('.')) {
        sessionStorage.redirect = window.location.href;
      }
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        const basePath = document.querySelector('meta[name="base"]')?.getAttribute('content') || '%BASE_URL%';
        const swPath = basePath.endsWith('/') ? basePath + 'service-worker.js' : basePath + '/service-worker.js';
        navigator.serviceWorker.register(swPath).catch(err => {
          console.log('Service Worker registration failed:', err);
        });
      }
    </script>
  </body>
</html>
